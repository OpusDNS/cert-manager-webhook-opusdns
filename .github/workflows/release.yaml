name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/opusdns/cert-manager-webhook-opusdns:${{ steps.version.outputs.VERSION }}
            ghcr.io/opusdns/cert-manager-webhook-opusdns:latest

  helm:
    name: Package & Publish Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: |
          helm package deploy/cert-manager-webhook-opusdns --destination .helm-pkg

      - name: Upload chart to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: .helm-pkg/*.tgz

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update Helm repo index
        run: |
          helm repo index .helm-pkg \
            --url https://github.com/OpusDNS/cert-manager-webhook-opusdns/releases/download/${{ github.ref_name }} \
            --merge gh-pages/index.yaml || \
          helm repo index .helm-pkg \
            --url https://github.com/OpusDNS/cert-manager-webhook-opusdns/releases/download/${{ github.ref_name }}
          cp .helm-pkg/index.yaml gh-pages/index.yaml

      - name: Push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Update Helm repo index for ${{ github.ref_name }}"
          git push
