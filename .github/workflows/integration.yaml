name: Integration Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    environment: preview1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Prepare testdata
        env:
          OPUSDNS_API_KEY: ${{ secrets.OPUSDNS_API_KEY }}
          OPUSDNS_API_ENDPOINT: ${{ secrets.OPUSDNS_API_ENDPOINT }}
        run: ./scripts/setup-testdata.sh

      - name: Run integration tests
        env:
          TEST_ZONE_NAME: "cert-manager-test.opusdns.dev."
        run: make test
