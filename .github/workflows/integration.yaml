name: Integration Tests

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "testdata/**"
      - "scripts/**"
      - ".github/workflows/integration.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration Tests (preview1)
    runs-on: self-hosted
    environment: preview1
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install make
        run: sudo apt-get install -y make

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare testdata
        env:
          OPUSDNS_API_KEY: ${{ secrets.OPUSDNS_API_KEY }}
          OPUSDNS_API_ENDPOINT: ${{ secrets.OPUSDNS_API_ENDPOINT }}
        run: ./scripts/setup-testdata.sh

      - name: Run integration tests
        env:
          TEST_ZONE_NAME: "cert-manager-test.opusdns.dev."
          TEST_DNS_SERVER: "ns1.opusdns.dev:53"
        run: make test
