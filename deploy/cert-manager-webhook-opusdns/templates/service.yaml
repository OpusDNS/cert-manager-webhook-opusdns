apiVersion: v1
kind: Service
metadata:
  name: {{ include "cert-manager-webhook-opusdns.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-manager-webhook-opusdns.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
      name: https
  selector:
    app: {{ include "cert-manager-webhook-opusdns.name" . }}
    release: {{ .Release.Name }}
